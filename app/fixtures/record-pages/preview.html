<!doctype html>

<script>
// ?frame=390x844：把本页放进指定大小的 iframe 里再打开，设置器按手机宽度排版（设置面板贴着窗口，不跟 ?size= 的舞台走）。
(function () {
  var q = new URLSearchParams(location.search);
  var m = /^([0-9]{2,4})x([0-9]{2,4})$/.exec(q.get('frame') || '');
  if (!m || window.top !== window) return;
  q.delete('frame');
  document.write('<body style="margin:0;background:#0b0d10"><iframe src="' + location.pathname + '?' + q + '" style="display:block;margin:0 auto;border:0;width:' + m[1] + 'px;height:' + m[2] + 'px"></iframe></body>');
  window.stop();
})();
</script>
<style>

@font-face{font-family:"Cormorant Garamond";font-style:normal;font-weight:400;font-display:swap;src:url("../../src/visual/igs-ui/assets/fonts/CormorantGaramond-Regular.woff2") format("woff2");}

<body>

<script type="module">
const errors = [];
const showErrors = () => { document.getElementById('errlog').textContent = errors.join('\n'); };
window.addEventListener('error', event => { errors.push(String(event.message || event.error) + ' @ ' + String(event.filename || '') + ':' + String(event.lineno || '')); document.title = 'ERR'; showErrors(); });
window.addEventListener('unhandledrejection', event => { errors.push('rejection: ' + String(event.reason?.message || event.reason)); document.title = 'ERR'; showErrors(); });
import { getOriginalReaderStyleText } from '../../src/visual/igs-ui/original-reader-source.js';
import { createRecordPanelController } from '../../src/visual/igs-ui/record-panel.js';
import { createMapPanelController } from '../../src/visual/igs-ui/map-panel.js';
import { mapFixture } from './fixtures/map.fixture.js';
import { diaryFixture } from './fixtures/diary.fixture.js';
import { inventoryFixture, combatInventoryFixture } from './fixtures/inventory.fixture.js';
import { relationshipsFixture } from './fixtures/relationships.fixture.js';
import { createCombatPreview } from './fixtures/combat.fixture.js';
import { createCombatPanelController } from '../../src/visual/igs-ui/combat-panel.js';
import { createCombatDeckPanelController } from '../../src/visual/igs-ui/combat-deck-panel.js';
import { buildSkillCutin, buildAwakenCutin, COMBAT_CUTIN_MS } from '../../src/visual/igs-ui/combat-cutin.js';
import { probeSpriteHead } from '../../src/visual/igs-ui/fx-anchor.js';
import { bootstrapIGS, createMemoryStorage } from '../../src/index.js';
import { isSettingsPage } from '../../src/visual/igs-ui/settings-pages.js';
import { chooseCard, emptyPick, flipCard, flipView, pickCardChoice, pickPurgeChoice } from '../../src/combat/flip.js';
import { FIXED_GENERAL_CARDS, fixedClassPool } from '../../src/combat/fixed-cards/index.js';

const style = document.createElement('style');
style.id = 'igs-overlay-style';
style.textContent = getOriginalReaderStyleText();
document.head.appendChild(style);

// fake 数据客户端：只读导出，写接口全部计数并拒绝。
const stats = { writes: 0, sends: 0 };
// 底图契约只收 http(s)/data：预览把相对资产路径解析成绝对 URL，验证真实底图加载链。
// ?basemap=none 模拟表格未填底图，走自动生成地图。
const basemapUrl = mapFixture.basemap && new URLSearchParams(location.search).get('basemap') !== 'none' ? new URL(mapFixture.basemap, location.href).href : '';
const mapSheet = {

  uid: mapFixture.uid, name: mapFixture.tableName,
  content: [['地点ID','上级地点ID','名称','x','y','说明','角色','排序','地图底图'],
    ...mapFixture.places.map((place, index) => [place.id.replace(/^p-/, 'p_'), '', place.name,
      place.x === null ? '' : String(place.x), place.y === null ? '' : String(place.y),
      place.description, place.characters.join('、'), String(index + 1), index === 0 ? basemapUrl : ''])]
};

const diarySheet = {
  uid: diaryFixture.uid, name: diaryFixture.tableName,
  content: [['写作角色','篇名','发生日期','正文'],
    ...diaryFixture.entries.map(entry => [entry.author || '', entry.chapterTitle || '', entry.date || '', entry.body || ''])]
};
// ?gear=1：战斗开启时的背包——物品表多出装备、道具、杂物，背包页拿到主角背包投影。
const gearPreview = new URLSearchParams(location.search).get('gear') === '1';
const inventorySheet = {
  uid: inventoryFixture.uid, name: inventoryFixture.tableName,
  content: [['物品名称','数量','描述'],
    ...(gearPreview ? combatInventoryFixture.items : []).map(item => [item.name, String(item.quantity), item.description]),
    ...inventoryFixture.items.map(item => [item.name, item.quantity === null ? '' : String(item.quantity), item.description])]
};
const relationshipsSheet = {
  uid: relationshipsFixture.uid, name: relationshipsFixture.tableName,
  content: [['姓名','身份','人物描述','人物A','人物B','关系'],
    ...relationshipsFixture.people.map(person => [person.name, person.role, person.description, '', '', '']),
    ...relationshipsFixture.edges.map(edge => ['', '', '',
      relationshipsFixture.people.find(person => person.id === edge.from)?.name || edge.from,
      relationshipsFixture.people.find(person => person.id === edge.to)?.name || edge.to,
      edge.label])]
};
// 人物数值：关系页按姓名读取「角色数值表」的好感度等纯数值列。
const metricsSheet = {
  uid: 'sheet_demo_metrics', name: '角色数值表',
  content: [['row_id','角色姓名','好感度','信任度','了解程度'], [1,'林夏','72','65','48'], [2,'陈屿','58','80','35']]
};
const tables = { [mapSheet.uid]: mapSheet, [diarySheet.uid]: diarySheet, [inventorySheet.uid]: inventorySheet, [relationshipsSheet.uid]: relationshipsSheet, [metricsSheet.uid]: metricsSheet };
const api = {
  exportTableAsJson: () => tables,
  registerTableUpdateCallback() {}, unregisterTableUpdateCallback() {},
  updateCell() { stats.writes++; }, insertRow() { stats.writes++; }, deleteRow() { stats.writes++; }, updateRow() { stats.writes++; return { ok: false }; },
};
const globalShim = { AutoCardUpdaterAPI: api, localStorage: window.localStorage };

const overlay = document.getElementById('igs-overlay');
const stage = document.getElementById('stage');
const heroInventory = gearPreview ? { ...structuredClone(combatInventoryFixture.view), others: inventoryFixture.items.map(item => ({ name: item.name, count: item.quantity })) } : null;
// 预览用的换装与使用：只改内存里的投影和示例物品表；装上时同部位已有装备被顶回背包。
const previewGear = (gearId, equip) => {
  const gear = heroInventory.gear;
  if (equip) {
    const index = gear.bag.findIndex(item => item.gearId === gearId);
    if (index < 0) return { ok: false, reason: 'combat-gear-missing' };
    const [item] = gear.bag.splice(index, 1);
    if (gear.slots[item.slot]) gear.bag.push(gear.slots[item.slot]);
    gear.slots[item.slot] = item;
    return { ok: true };
  }
  const slot = Object.keys(gear.slots).find(key => gear.slots[key]?.gearId === gearId);
  if (!slot) return { ok: false, reason: 'combat-gear-missing' };
  gear.bag.push(gear.slots[slot]);
  delete gear.slots[slot];
  return { ok: true };
};
const previewUse = name => {
  const item = heroInventory.items.find(entry => entry.name === name);
  if (!item) return { ok: false, reason: 'combat-use-not-item', draft: true };
  const row = inventorySheet.content.find(cells => cells[0] === name);
  const left = Number(row?.[1]) - 1;
  item.count = left;
  if (left > 0) row[1] = String(left);
  else { inventorySheet.content.splice(inventorySheet.content.indexOf(row), 1); heroInventory.items.splice(heroInventory.items.indexOf(item), 1); }
  return { ok: true };
};
// ?itemart=1：给每件物品画一张示意物品图（canvas 转 data:image/png，按名字配色），用于看背包详情头的点击放大；不读任何本地素材。
const itemArtPreview = new URLSearchParams(location.search).get('itemart') === '1';
const itemArtCache = new Map();
const previewItemArt = name => {
  if (!itemArtPreview || !name) return '';
  if (itemArtCache.has(name)) return itemArtCache.get(name);
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 512;
  const g = canvas.getContext('2d');
  const hue = Array.from(name).reduce((sum, ch) => sum + ch.codePointAt(0), 0) % 360;
  const bg = g.createRadialGradient(256, 220, 40, 256, 256, 300);
  bg.addColorStop(0, `hsl(${hue} 70% 62%)`); bg.addColorStop(1, `hsl(${(hue + 40) % 360} 45% 18%)`);
  g.fillStyle = bg; g.fillRect(0, 0, 512, 512);
  g.fillStyle = 'rgba(255,255,255,.9)'; g.font = '700 220px "Source Han Serif CN",serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(Array.from(name)[0], 256, 270);
  const url = canvas.toDataURL('image/png');
  itemArtCache.set(name, url);
  return url;
};
const record = createRecordPanelController(document, globalShim, async () => ({ ok: true }), {
  ...(heroInventory ? { getHeroInventory: () => heroInventory, setHeroGear: async (id, equip) => previewGear(id, equip), useInventoryItem: async name => previewUse(name) } : {}),
  ...(itemArtPreview ? { resolveItemImage: previewItemArt } : {}),
});
const map = createMapPanelController(document, globalShim, async () => ({ ok: true }), { getChatId: () => 'preview-chat' });
const SIZES = {
  desktop: [1440, 900], ref: [1672, 941], mid: [1024, 768],
  tall: [900, 1700], mobile: [390, 844], short: [390, 500], tiny: [320, 568],
};
let current = null;
// 设置器素材页截图入口：真实设置器 + 内存存储（不写浏览器 localStorage）+ 示例素材与本地文件夹归类。
// 可选参数：?subtab=scenes|characters、?view=grid|list。
let settingsVn = null;
function openSettingsScene() {
  const q = new URLSearchParams(location.search);
  const img = new URL('./assets/scene-demo-clean-night.png', location.href).href;
  const mem = createMemoryStorage();
  // ?card=卡名：模拟打开了一张角色卡，小雪和睡衣提示词放在这张卡里，其余在全局。
  const cardAssets = {
    characters: { 小雪: q.get('gen') ? { 默认: 'igs-gen:snow-default', 微笑: 'igs-gen:snow-smile', 害羞: '' } : { 默认: img, 微笑: img, 害羞: '' }, ...(q.get('creature') ? { 岩甲蜥: { 默认: img }, 狐妖: { 默认: img } } : {}) },
    characterAliases: { 小雪: ['雪'] },
    characterOutfits: { 小雪: { 校服: { moods: { 微笑: img }, words: ['制服'], scenes: [], note: '' }, 睡衣: { moods: {}, words: [], scenes: ['卧室'], note: '晚上在家' } } },
    wardrobe: { 睡衣: { prompt: 'pink pajamas' } },
  };
  mem.setItem('igs_bridge_config', JSON.stringify({ ...(q.get('nai') ? { imageApi: { mode: 'nai' } } : {}), sceneAssets: {
    enabled: true, promptRule: '规则', characterAliases: {}, moodGroups: [],
    // 带时间行和长名字，看窄屏挤不挤。
    scenes: { 教室: { url: img, times: { '14:50': { url: img } } }, 走廊: { url: img, times: {} }, 海边: { url: img, times: { '黄昏': { url: img } } }, 天台: { url: '', times: {} }, 伦敦国王十字车站: { url: 'https://example.com/london.png', times: {} } },
    characters: { 林夏: { 普通: img, 微笑: img }, 陈屿: { 普通: img }, 路人: { 普通: '' } },
    characterDna: { 林夏: { identity: '黑色长发，琥珀色眼睛' }, ...(q.get('creature') ? { 岩甲蜥: { creature: { form: 'beast', size: 'large' } }, 狐妖: { creature: { form: 'humanoid', size: 'medium', framing: 'half' } } } : {}) },
    wardrobe: { 校服: { prompt: 'white shirt, pleated skirt' }, 泳装: { prompt: '' } },
    ...(q.get('card') ? { cards: { [`card:${q.get('card')}`]: cardAssets } } : cardAssets),
  } }));
  // 待确认页示例：未登记的服装词和词库外的情绪词。
  mem.setItem('igs:outfit-review:v1', JSON.stringify({ version: 1, items: [{ character: '小雪', word: '泳装' }, { character: '林夏', word: '校服' }, { character: '路人', word: '西装' }] }));
  mem.setItem('igs:scene-presets:v1', JSON.stringify({ version: 1, active: '', presets: {
    现代校园: { scenes: { 教室: { url: img, times: {} } }, characters: { 林夏: { 普通: img } } },
    古风江湖: { scenes: { 客栈: { url: img, times: {} } }, characters: { 沈青: { 默认: img } } },
    雪之国日常: { scenes: { 教室: { url: img, times: {} } }, characters: {}, scopeCards: { 'card:雪之国': { label: '雪之国', library: { scenes: { 小雪的房间: { url: img } }, characters: { 小雪: { 默认: img } } } } } },
  } }));
  mem.setItem('igs:mood-review:v1', JSON.stringify({ version: 1, items: [{ word: '幽怨' }, { word: '嘲弄' }] }));
  if (q.get('recent')) mem.setItem('igs:settings-recent:v1', JSON.stringify([{ path: 'readerSettings.showStatusLine', label: '显示页码', page: 'style' }, { path: 'readerSettings.dialogSkin', label: '对话框皮肤', page: 'style' }, { path: 'bridge.optionBubble.enabled', label: '启用选项气泡', page: 'ui-option' }]));
  const view = q.get('view') === 'list' ? 'list' : 'grid';
  mem.setItem('igs-asset-folders-v1', JSON.stringify({ scopes: { '': {
    scenes: { view, folders: ['学校', '户外'], collapsed: [], assign: { 教室: '学校', 走廊: '学校', 海边: '户外' } },
    characters: { view, folders: ['主角'], collapsed: [], assign: { 林夏: '主角' } },
  } } }));
  // 只替换 localStorage，其余全局能力沿用真实 window；小写方法绑定到 window，避免 Illegal invocation。
  const globalProxy = new Proxy(window, { get(target, key) {
    if (key === 'localStorage') return mem;
    if (key === 'SillyTavern' && q.get('card')) return { getContext: () => ({ name2: q.get('card'), characters: [] }) };
    const value = Reflect.get(target, key, target);
    return typeof value === 'function' && typeof key === 'string' && /^[a-z]/.test(key) ? value.bind(target) : value;
  } });
  // ?gen=1：假的生成图服务，igs-gen: 地址都显示成示例图，另放两张刚生成的图。
  const fakeGen = q.get('gen') ? new Proxy({
    resolveUrl: (url) => (String(url || '').startsWith('igs-gen:') ? img : url),
    writeWardrobePrompt: async () => ({ ok: true, prompt: 'pink pajamas' }),
    listTemp: () => [
      { key: 'temp/sp', type: 'sprite', name: '小雪 · 泳装', status: '临时', imageId: 'tmp-sp', url: img },
      { key: 'temp/bg', type: 'background', name: '海边黄昏', status: '临时', imageId: 'tmp-bg', url: img },
    ],
  }, { get: (target, key) => (key in target ? target[key] : (typeof key === 'string' ? () => undefined : undefined)) }) : undefined;
  settingsVn = settingsVn || bootstrapIGS({
    global: globalProxy,
    ...(fakeGen ? { assetGenerationService: fakeGen } : {}),
    autoAttachMagicWand: false,
    hostAdapter: { getCurrentMessage: async () => ({ id: 1, text: '素材设置预览。' }), typeAndSend: async () => ({ ok: true }) },
  });
  const mode = (q.get('size') || 'desktop').match(/^(mobile|short|tiny)$/) ? 'mobile' : 'pc';
  // ?page=<设置页 id> 直接打开某页（dash style text ui perf-text perf-stage perf-story perf-special perf-rhythm sound chars wardrobe review scenes eventcg cglib source kinds llm rules parse data logs）；
  // ?page=settings-scene 或 ?tab=<分类或旧 tab id> 仍可用（旧 tab：basic reader scene image，默认 scene）；?readersub= 切旧的阅读器子页。
  const wanted = q.get('page');
  const opened = settingsVn.openSettings({ ...(isSettingsPage(wanted) ? { page: wanted } : { tab: q.get('tab') || 'scene' }), mode });
  const readerSub = q.get('readersub');
  if (readerSub) opened.controller?.switchReaderSubTab?.(readerSub);
  if (!opened || opened.ok === false) throw new Error('settings-scene: openSettings failed ' + JSON.stringify(opened));
  const subtab = q.get('subtab');
  if (subtab) opened.controller?.switchSceneSubTab?.(subtab);
  // ?act=命令:参数:参数,… 依次点设置里的 data-action 按钮（参数按原文写，这里替它编码）。
  if (fakeGen && q.get('wardrobe-pick') === '1') {
    document.querySelector(`[data-action="wardrobe-generate-prompt:${encodeURIComponent('睡衣')}"]`)?.click();
    setTimeout(() => {
      const editor = document.querySelector('.igs-settings-dialog.is-edit');
      editor?.querySelector('[data-settings-dialog="ok"]')?.click();
    }, 0);
  }
  for (const step of (q.get('act') || '').split(',').filter(Boolean)) {
    const [command, ...rest] = step.split(':');
    // ui-toggle-open 的键本身带冒号，整段当一个参数。
    const segs = command === 'ui-toggle-open' ? [rest.join(':')] : rest;
    const action = [command, ...segs.map(encodeURIComponent)].join(':');
    document.querySelector(`[data-action="${CSS.escape(action)}"]`)?.click();
  }
  // ?menu=CSS 选择器：打开对应的 ⋯ 下拉菜单。
  const menuSel = q.get('menu');
  if (menuSel) { const menu = document.querySelector(menuSel); if (menu) menu.open = true; }
  // ?focus=CSS 选择器：把该元素滚到设置面板顶部再截图。
  const focus = q.get('focus');
  if (focus) setTimeout(() => { const el = document.querySelector(focus); if (el) { el.style.scrollMarginTop = '96px'; el.scrollIntoView({ block: 'start' }); } }, 0);
  // ?open=折叠区键,… 展开对应的 data-advanced 折叠区。
  for (const key of (q.get('open') || '').split(',').filter(Boolean)) {
    const node = document.querySelector(`[data-advanced="${CSS.escape(key)}"]`);
    if (node) node.open = true;
  }
  // ?nav=open：窄屏下把分类抽屉展开再截图。
  if (q.get('nav') === 'open') document.getElementById('igs-unified-settings')?.setAttribute('data-igs-nav', 'open');
  return { close: () => opened.controller?.close?.() };
}
// 战斗面板预览：内存战斗表与存档；?combat=battle 直接开战，?combat=end 打到结束。
const combatPreview = createCombatPreview();
// ?res=mage|mage3|bard|priest|warrior|summoner|all：给主战者叠一组假资源，只改面板读到的快照，不写引擎状态，用于看资源条排版。
const RES_PREVIEW = {
  mage: { orbs: { slots: 10, list: ['lightning', 'frost', 'dark', 'plasma', 'glass', 'lightning', 'frost'].map(kind => ({ kind })) }, focus: 2 },
  mage3: { orbs: { slots: 3, list: [{ kind: 'lightning' }, { kind: 'frost' }] }, focus: 0 },
  bard: { stance: 'wrath', momentum: 7 },
  priest: { radiance: 6 },
  warrior: { forge: { value: 14 } },
  summoner: { minion: { hp: 9, maxHp: 15 } },
};
RES_PREVIEW.all = Object.assign({}, RES_PREVIEW.mage, RES_PREVIEW.bard, RES_PREVIEW.priest, RES_PREVIEW.warrior, RES_PREVIEW.summoner);
const resPreview = RES_PREVIEW[new URLSearchParams(location.search).get('res') || ''] || null;
// ?marks=1：给主战者手牌前五张依次挂规则 v5 E19 牌面附着（绑定、加费、痛刺、虚无、受创），只改面板读到的快照，用于看牌面关键字；可与 ?res= 同用。
const MARK_PREVIEW = ['bound', 'taxed', 'pain', 'ethereal', 'scar'];
const marksPreview = new URLSearchParams(location.search).get('marks') === '1';
// ?inscribe=1：给主战者手牌前五张依次挂规则 v5 P5b 刻印（锋利、灵巧、稳持、蚀心、预燃）；?inscribe=键1,键2 可指定刻印。只改面板读到的快照，可与 ?marks=1 同用。
const inscribeParam = new URLSearchParams(location.search).get('inscribe') || '';
const INSCRIBE_PREVIEW = inscribeParam === '1' ? ['sharp', 'deft', 'steady', 'corrode', 'kindle'] : inscribeParam.split(',').map((s) => s.trim()).filter(Boolean);
const previewBattle = (b) => {
  const id = b && b.controlledId;
  if (!b || !b.units || !b.units[id]) return b;
  let next = b;
  if (resPreview) next = { ...next, units: { ...next.units, [id]: { ...next.units[id], res: { ...next.units[id].res, ...resPreview } } } };
  const hand = marksPreview || INSCRIBE_PREVIEW.length ? (next.piles?.[id]?.hand || []) : [];
  if (hand.length) {
    const cards = { ...next.cards };
    if (marksPreview) hand.slice(0, MARK_PREVIEW.length).forEach((inst, i) => { cards[inst] = { ...cards[inst], marks: [MARK_PREVIEW[i]] }; });
    hand.slice(0, INSCRIBE_PREVIEW.length).forEach((inst, i) => { cards[inst] = { ...cards[inst], inscription: INSCRIBE_PREVIEW[i] }; });
    next = { ...next, cards };
  }
  return next;
};
const baseSession = !resPreview && !marksPreview && !INSCRIBE_PREVIEW.length ? combatPreview.session : { ...combatPreview.session, state() {

  return st.battle ? { ...st, battle: previewBattle(st.battle) } : st;
} };
// ?loot=v6（配合 ?combat=end）：结算时换成一份规则 v6 示例战利品（卡牌槽三选一：本职业固定、无色固定、本职业随机），翻牌、取候选与跳过只改内存。
const lootPreview = new URLSearchParams(location.search).get('loot') === 'v6';
const warriorPool = fixedClassPool('warrior');
const lootOffer = {
  combatId: 'preview-loot', reveal: 0,
  slots: [
    { index: 0, kind: 'card', rarity: 'uncommon', name: '裂空斩', origin: '桥头一战后的领悟', choices: [
      JSON.parse(JSON.stringify(warriorPool.find((c) => c.rarity === 'uncommon') || warriorPool[0])),
      { id: 'rc-preview', name: '裂空斩', type: 'attack', cost: 1, rarity: 'uncommon', effects: [{ op: 'damage', amount: 9 }, { op: 'status', status: 'vulnerable', stacks: 1, target: 'enemy' }] },
      JSON.parse(JSON.stringify(FIXED_GENERAL_CARDS.find((c) => c.rarity === 'uncommon') || FIXED_GENERAL_CARDS[0])),
    ] },
    { index: 1, kind: 'keepsake', rarity: 'rare', name: '旧铜铃', origin: '狼群首领颈上挂着的' },
    { index: 2, kind: 'item', rarity: 'common', name: '止血草', origin: '', item: { count: 1 } },
  ],
};
let lootPick = emptyPick();
const lootStep = (next) => { if (next.ok) lootPick = next.pick; return Promise.resolve(next.ok ? { ok: true } : { ok: false, reason: next.reason }); };
// ?purge=1（配合 ?combat=end&loot=v6）：本场视为第 5 场普通胜利，结算页同时给一次删牌机会（75 金钱）；?purge=poor 为金钱不足。只改内存。
const purgeParam = new URLSearchParams(location.search).get('purge') || '';
const purgeOffer = !purgeParam ? null : purgeParam === 'poor' ? { battle: 5, cost: 75, available: false, reason: 'combat-points-insufficient' }
  : { battle: 5, cost: 75, available: true, cards: warriorPool.slice(0, 6).flatMap((c, i) => Array.from({ length: i < 2 ? 3 : 1 }, (_, k) => {
      const up = i === 0 && k === 0 && c.upgraded ? c.upgraded : null;
      return { copyId: `preview-${c.id}:${k}`, cardId: c.id, name: c.name, type: c.type, cost: up?.cost ?? c.cost, rarity: c.rarity, effects: up?.effects || c.effects, ...(up ? { upgraded: true } : {}), ...(i === 1 && k === 0 ? { bonus: { damage: 2, block: 0 } } : {}),
        ...(c.innate || c.retain || c.ethereal ? { keywords: { innate: c.innate, retain: c.retain, ethereal: c.ethereal } } : {}) };
    })) };
const combatSession = !lootPreview ? baseSession : { ...baseSession,
  state() { const st = baseSession.state(); return st.status === 'ended' || st.status === 'send-failed' ? { ...st, flip: flipView(lootOffer, lootPick, { points: 100, payer: false }, purgeOffer) } : st; },
  loadFlip: async () => ({ ok: true }),
  flip: (i) => lootStep(flipCard(lootOffer, lootPick, i)), choose: (i) => lootStep(chooseCard(lootOffer, lootPick, i)),
  pickCard: (v) => lootStep(pickCardChoice(lootOffer, lootPick, v)), pickPurge: (v) => lootStep(pickPurgeChoice(purgeOffer, lootPick, v)),
  reroll: async () => ({ ok: false, reason: 'combat-reroll-unavailable' }) };
// ?skin=<皮肤键>（veil comic ink tech mystic soft-a soft-c dark-a dark-b initial）：换战斗面板皮肤，缺省黑幕。
// ?combat=end 自动打完一场，按减少动态效果跑，结算前不播长演出。
const autoEnd = new URLSearchParams(location.search).get('combat') === 'end';
const combat = createCombatPanelController(document, { getSession: () => combatSession, getLedger: () => combatPreview.ledger, skin: () => new URLSearchParams(location.search).get('skin') || '', ...(autoEnd ? { reducedMotion: () => true } : {}) });
// 截图脚本以 combatReady 判定本场景已就绪，不以中间态（lobby 后尚未开战）截图。
const combatState = { ready: false, want: '' };
async function openCombat() {
  combatState.ready = false;
  combat.open(overlay, { messageId: combatPreview.messageId });
  const want = new URLSearchParams(location.search).get('combat') || 'lobby';
  combatState.want = want;
  for (let i = 0; i < 40 && combat.view()?.status !== 'lobby'; i += 1) await new Promise(r => setTimeout(r, 25));
  if (want !== 'lobby') combat.invoke('start');
  // 结束回合后面板会锁住演出（combat-busy），每步之间让出事件循环，等演出播完再继续出牌。
  const deadline = Date.now() + 120000;
  while (want === 'end' && Date.now() < deadline && combat.view()?.status === 'battle') {
    await new Promise(r => setTimeout(r, 20));
    // 先出要选目标的攻击牌，避免只打格挡牌拖到输掉（输了不翻牌）。
    const battle = combat.view().battle;
    const playable = battle.hand.filter(c => c.playable);
    const card = playable.find(c => c.targets.length) || playable[0];
    if (!card) { combat.invoke('end-turn'); continue; }
    const r = combat.invoke('card', card.inst);
    if (r.reason === 'combat-busy') continue;
    // 鞭尸状态下已倒下的敌人也在可选目标里，优先打还活着的。
    const alive = new Set(battle.enemies.filter(u => u.alive).map(u => u.id));
    if (!r.ok) combat.invoke('target', card.targets.find(id => alive.has(id)) ?? card.targets[0] ?? card.affects[0]);
  }
  // ?cutin=skill|awaken：挂一张真实技能 / 觉醒特写并停在中段，用于看字号与位置；&skill= 换招式名（觉醒为类型），&awaken= 情绪（rage guard grief resolve bond limit vengeance unyielding），&line= 台词；
  // &portrait=<文件名> 读本机 tools/local-preview/assets/<文件名>.png 作立绘（该目录不随仓库提交），不传时不画立绘。
  const cq = new URLSearchParams(location.search);
  if (['skill', 'awaken'].includes(cq.get('cutin'))) {
    const host = document.querySelector('#igs-combat-panel .igs-combat-fx');
    if (host) {
      const awaken = cq.get('cutin') === 'awaken';
      const freeze = document.createElement('style');
      freeze.textContent = awaken
        ? '.igs-combat-awaken-cutin,.igs-combat-awaken-cutin *{animation-play-state:paused!important;animation-delay:-1700ms!important;}'
        : '.igs-combat-cutin,.igs-combat-cutin *{animation-play-state:paused!important;animation-delay:-900ms!important;}';
      // &loop=1：不定格，整段特写反复重播；默认定格在中段（背景纹样与粒子是伪元素，定格时照常动）。
      const loop = cq.get('loop') === '1';
      if (!loop) document.head.appendChild(freeze);
      const pick = cq.get('portrait');
      const url = pick && pick !== 'none' ? new URL('../../tools/local-preview/assets/' + encodeURIComponent(pick) + '.png', location.href).href : '';
      // 与战斗面板同一条探测：头位、眼部裁切与色调（立绘缩到 25×25 后取最亮的不透明像素）都来自 probeSpriteHead。
      const probed = url ? await probeSpriteHead(url, document).catch(() => null) : null;
      const mount = () => {
        const el = awaken
          ? buildAwakenCutin(document, { name: cq.get('name') || '林夏', skill: cq.get('skill') || '决意', line: cq.get('line') || '这一次，我不会再退后半步。', awakenType: cq.get('awaken') || 'resolve', url, probed })
          : buildSkillCutin(document, { name: cq.get('name') || '林夏', skill: cq.get('skill') || '星落·破晓斩', url, probed });
        host.appendChild(el);
        return el;
      };
      let shown = mount();
      if (loop) setInterval(() => { shown.remove(); shown = mount(); }, (awaken ? COMBAT_CUTIN_MS.awaken : COMBAT_CUTIN_MS.skill) + 700);
    }
  }
  combatState.ready = true;
}
// 人物状态面板 · 只开数值系统（P8c）：不注入战斗账本，本聊天为手动建档；名单为尚无建档的主角与带关系的角色，确认建档只改内存。
// 可选 ?build=<名字> 打开后直接定位到这位角色（同提示条「填写」）。
const buildAttr = { initialized: false, table: 'ok', role: 'warrior', className: '' };
const buildDone = new Set();
const deckBuild = createCombatDeckPanelController(document, {
  getLedger: () => null,
  buildMode: () => 'manual',
  buildEntry: () => true,
  writeManualInit: async (name) => { buildDone.add(name); return { ok: true }; },
  getBuildCandidates: async () => ({ ok: true, table: 'ok', list: [['阿明', true], ['林夏', false], ['陈屿', false]]
    .filter(([name]) => !buildDone.has(name)).map(([name, protagonist]) => ({ name, protagonist, attributes: buildAttr })) }),
});
// 人物状态面板 · 战斗开启：读战斗示例账本（主角与职业档案）；?deckpage=status|alloc|gear|deck 打开后切到该页。写入能力只给空函数，用于显示按钮。
// 同带 ?inscribe= 时，卡组角色按副本顺序给前几张副本挂上同一组刻印（只改面板读到的归并视图），用于看卡组页的副本标签。
const inscribeCopies = (c) => {
  if (c.kind !== 'deck-character' || !Array.isArray(c.copies)) return c;
  const marked = new Map(c.copies.slice(0, INSCRIBE_PREVIEW.length).map((row, i) => [row.copyId, INSCRIBE_PREVIEW[i]]));
  const mark = (row) => (marked.has(row.copyId) ? { ...row, inscription: marked.get(row.copyId) } : row);
  return { ...c, copies: c.copies.map(mark), deckEntries: (c.deckEntries || []).map(mark) };
};
const deckLedger = !INSCRIBE_PREVIEW.length ? combatPreview.ledger : { ...combatPreview.ledger, async effectiveState() {
  const st = await combatPreview.ledger.effectiveState();
  if (!st?.ok || !st.characters) return st;
  return { ...st, characters: new Map([...st.characters].map(([id, c]) => [id, inscribeCopies(c)])) };
} };
const deckNoop = async () => ({ ok: false, reason: 'combat-generate-unavailable' });
const deckFull = createCombatDeckPanelController(document, {
  getLedger: () => deckLedger, getSession: () => combatPreview.session,
  regenerateDeck: deckNoop, respecClass: deckNoop, ascendClass: deckNoop, drawTrait: deckNoop, pickTrait: deckNoop, unlockTraitSlot: deckNoop,
  getTheme: () => new URLSearchParams(location.search).get('theme') || '', setTheme: () => {},
});
async function openDeckFull() {
  deckFull.open(overlay);
  for (let i = 0; i < 80 && deckFull.view()?.status !== 'ready'; i += 1) await new Promise(r => setTimeout(r, 25));
  const want = new URLSearchParams(location.search).get('deckpage');

function openPage(page) {
  current?.close?.();
  if (page === 'deck') { current = deckFull; openDeckFull(); }
  // 设置面板也有 id 为 combat 的页面，page=combat 会先进设置页；战斗面板用 page=combat-panel 打开。
  else if (page === 'combat-panel') { current = combat; openCombat(); }
  else
  if (page === 'settings-scene' || isSettingsPage(page)) current = openSettingsScene();
  else if (page === 'combat') { current = combat; openCombat(); }
  else if (page === 'deck-build') { current = deckBuild; deckBuild.open(overlay, { build: new URLSearchParams(location.search).get('build') || null }); }
  else if (page === 'map') current = map, map.open(overlay, { weatherFx: { enabled: true } }, '临河街道', new URLSearchParams(location.search).get('time') || '', new URLSearchParams(location.search).get('weather') || '');
  else current = record, record.open(overlay, {}, page);

function setSize(name) {
  const [w, h] = SIZES[name] || SIZES.desktop;
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
}
const params = new URLSearchParams(location.search);
setSize(params.get('size') || 'desktop');
if (params.get('bg') === 'none') stage.dataset.bg = 'none';
openPage(params.get('page') || 'map');
// 可选 ?select=<data-record-id>：打开后自动选中，用于阅读态/详情态截图。
const selectId = params.get('select');
if (selectId) document.querySelector(`[data-record-id="${CSS.escape(selectId)}"],[data-map-id="${CSS.escape(selectId)}"]`)?.click();
// 可选 ?click=act:id,act:id：按顺序点击资料页控件（如 diary-view:timeline、toggle-prefs:、group:文书）。

  const cut = step.indexOf(':');
